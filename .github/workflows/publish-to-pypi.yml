name: Publish BPL to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install .
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Validate and run bundled examples
        run: |
          bpl examples --export ./bpl-examples
          bpl validate ./bpl-examples/aging_system.bpl
          bpl validate ./bpl-examples/tissue_repair.bpl
          bpl interact validate ./bpl-examples/senescence_immune_lysosome.bpl
          bpl interact run ./bpl-examples/senescence_immune_lysosome.bpl --csv interaction-results.csv

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          from bpl import __version__
          if version != __version__:
              raise SystemExit(f"pyproject version {version!r} does not match bpl.__version__ {__version__!r}")
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} does not match package version {expected!r}")
          print(f"Release tag and package versions match: {actual}")
          PY
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bpl-biosim
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
