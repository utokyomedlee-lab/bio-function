[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bpl-biosim"
version = "0.3.0"
description = "BPL: a multi-scale biological programming and simulation language reference interpreter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BPL Project"}]
keywords = ["biology", "systems-biology", "simulation", "dsl", "aging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bpl = "bpl.cli:main"
bal-sim = "bal.cli:main"

[tool.setuptools]
packages = ["bpl", "bpl.examples", "bal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
bpl = ["examples/*.bpl"]

[project.urls]
Homepage = "https://github.com/utokyomedlee-lab/bio-function"
Repository = "https://github.com/utokyomedlee-lab/bio-function"
Documentation = "https://github.com/utokyomedlee-lab/bio-function#readme"
Issues = "https://github.com/utokyomedlee-lab/bio-function/issues"
